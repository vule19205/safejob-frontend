
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - SafeJob</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <div class="register-container">

        <div class="register-box">

            <div class="logo">
                <i class="bi bi-shield-check"></i>
                <span>SafeJob</span>
            </div>

            <h2>Tạo tài khoản</h2>
            <p class="subtitle">Tham gia nền tảng tuyển dụng an toàn</p>

            <div id="message"></div>

            <form id="registerForm">

                <div class="mb-3">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control"
                           id="fullName" name="fullName"
                           placeholder="Nhập họ và tên">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control"
                           id="email" name="email"
                           placeholder="example@gmail.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <div class="password-box">
                        <input type="password" class="form-control"
                               id="password" name="password"
                               placeholder="Nhập mật khẩu">
                        <i class="bi bi-eye toggle-password"
                           data-target="password"></i>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Xác nhận mật khẩu
                    </label>
                    <div class="password-box">
                        <input type="password" class="form-control"
                               id="confirmPassword" name="confirmPassword"
                               placeholder="Nhập lại mật khẩu">
                        <i class="bi bi-eye toggle-password"
                           data-target="confirmPassword"></i>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label">Loại tài khoản</label>
                    <select class="form-select" id="role" name="role">
                        <option value="candidate">Người tìm việc</option>
                        <option value="employer">Nhà tuyển dụng</option>
                    </select>
                </div>

                <button type="submit" class="btn-register" id="registerButton">
                    Đăng ký tài khoản
                </button>

            </form>

            <div class="login-link">
                Đã có tài khoản?
                <a href="login.html">Đăng nhập ngay</a>
            </div>

            <div class="back-home">
                <a href="index.html">
                    <i class="bi bi-arrow-left"></i> Quay lại trang chủ
                </a>
            </div>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
