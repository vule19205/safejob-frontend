
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - SafeJob</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand brand-logo" href="index.html">
                <i class="bi bi-shield-check"></i> SafeJob
            </a>

            <a href="index.html" class="back-home">
                <i class="bi bi-arrow-left"></i> Trang chủ
            </a>
        </div>
    </nav>

    <main class="login-section">
        <div class="container">
            <div class="login-card">

                <div class="login-icon">
                    <i class="bi bi-person-lock"></i>
                </div>

                <h2>Chào mừng trở lại!</h2>

                <p class="login-description">
                    Đăng nhập để tiếp tục sử dụng SafeJob
                </p>

                <div id="loginMessage"></div>

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Địa chỉ email
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input type="email"
                                class="form-control"
                                id="email"
                                placeholder="Nhập email của bạn"
                                required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Mật khẩu
                        </label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input type="password"
                                class="form-control"
                                id="password"
                                placeholder="Nhập mật khẩu"
                                required>

                            <button class="btn btn-outline-secondary"
                                type="button"
                                id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login w-100">
                        Đăng nhập
                    </button>

                </form>

                <div class="register-link">
                    Chưa có tài khoản?
                    <a href="register.html">Đăng ký ngay</a>
                </div>

                <div class="login-footer">
                    <i class="bi bi-shield-check"></i>
                    SafeJob - Tuyển dụng an toàn và minh bạch
                </div>

            </div>
        </div>
    </main>

    <script src="js/login.js"></script>

</body>
</html>
